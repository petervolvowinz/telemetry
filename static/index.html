<!DOCTYPE html>
<html>
<head>
    <title>Simple OpenStreetMap with Leaflet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            crossorigin=""
    />
    <style>
        #map { height: 100vh; }
        body { margin: 0; }
    </style>
</head>
<body>
<div id="map"></div>
<script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""
></script>
<script>
    var map = L.map('map').setView([37.7749, -122.4194], 13); // San Fransisco default

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a> contributors'
    }).addTo(map);
</script>
</body>
</html>
